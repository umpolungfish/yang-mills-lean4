name = "«yang-mills»"
version = "0.1.0"
keywords = ["mathematics", "quantum-field-theory", "yang-mills", "formal-verification"]
defaultTargets = ["Imscribing.YangMills"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

weak.linter.mathlibStandardSet = false
weak.linter.unusedVariables = false
weak.linter.unusedSimpArgs = false
weak.linter.unusedTactic = false
weak.linter.unreachableTactic = false
weak.linter.unnecessarySimpa = false
weak.linter.unnecessarySeqFocus = false
weak.linter.unusedSectionVars = false
weak.linter.unusedDecidableInType = false
weak.linter.dupNamespace = false
weak.linter.flexible = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

[[lean_lib]]
name = "Imscribing"
globs = [
  "Imscribing.YangMills",
  "Imscribing.YangMills.Core",
  "Imscribing.YangMills.CubicHaar4D",
  "Imscribing.YangMills.OSCompletion",
  "Imscribing.YangMills.FeynmanKacAndStrongCoupling",
  "Imscribing.YangMills.Wilson4DOp",
  "Imscribing.YangMills.FeynmanKac",
  "Imscribing.YangMills.StrongCouplingDobrushin",
  "Imscribing.YangMills.StrongCouplingInfVol",
  "Imscribing.YangMills.ContinuumClosure",
  "Imscribing.YangMills.CanonicalWitness",
  "Imscribing.YangMills.BridgeStatements",
  "Imscribing.YangMills.PlaquetteReflection",
  "Imscribing.YangMills.Dicke",
  "Imscribing.YangMills.UnifiedLattice",
  "Imscribing.YangMills.MassGapInstances",
  "Imscribing.YangMills.GlobalAxioms",
  "Imscribing.YangMills.GappedGaugeSystem",
  "Imscribing.YangMills.ContinuumDecomposition",
  "Imscribing.YangMills.IIDSchwinger",
  "Imscribing.YangMills.IIDWilsonLimit",
  "Imscribing.YangMills.IIDScaling",
  "Imscribing.YangMills.RademacherL1",
  "Imscribing.YangMills.RademacherMulti",
  "Imscribing.YangMills.SUNHaar",
  "Imscribing.YangMills.ProbIntegralTransform",
  "Imscribing.YangMills.PiFubini"
]
